[workspace]
resolver = "2"
members = [
  "common",
  "project-escrow",
  "verifier-registry",
  "verification",
  "integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned: matches Stellar CLI 25.x; contracts built with protocol-25 SDK run on newer protocols (testnet is 29).
soroban-sdk = "=25.3.2"
veridia-common = { path = "common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
