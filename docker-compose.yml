# Local development services. Credentials here are for local development only.
name: veridia
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veridia
      POSTGRES_PASSWORD: veridia
      POSTGRES_DB: veridia
    ports: ["5544:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridia"]
      interval: 5s
      retries: 10

  s3:
    # S3-compatible private object storage (MinIO images are no longer on Docker Hub).
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/s3.json:/etc/seaweedfs/s3.json:ro

  stellar:
    image: stellar/quickstart:latest
    command: --local --limits unlimited
    ports: ["8000:8000"]
    profiles: ["stellar"]

volumes:
  pgdata:
  s3data:
